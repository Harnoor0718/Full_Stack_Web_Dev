<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning</title>

    <style>
        .container{
            position: relative;
            width: 400px;
            height: 400px;
            border: 1px solid #000;
        }

        .box1{
            position: static;
            width: 100px;
            height: 100px;
            background-color: red;
        }

        .box2{
            position: sticky;
            top: 20px;
            left: 20px;
            width: 100px;
            height: 100px;
            background-color: green;
        }

        .box3{
            position: absolute;
            top: 50px;
            left: 50px;
            width: 100px;
            height: 100px;
            background-color: blue;
        }

        .box4{
            position: fixed;
            top: 100px;
            left: 100px;
            width: 100px;
            height: 100px;
            background-color: yellow;
        }
    </style>
</head>
<body>

    Understanding CSS Positioning : static, relative, absolute, fixed, sticky

    <div class="container">
        <div class="box1">Box 1</div>
        <div class="box2">Box 2</div>
        <div class="box3">Box 3</div>
        <div class="box4">Box 4</div>
    </div>

</body>
</html>
